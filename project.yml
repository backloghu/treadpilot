name: TreadPilot
options:
  bundleIdPrefix: hu.backlog
  # English is the base language (key + fallback); Hungarian lives as a
  # translation in the String Catalogs (Localizable.xcstrings / InfoPlist.xcstrings).
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Project-level setting — every target inherits it, so the development team
# does not have to be set separately in Xcode or for a CLI build.
settings:
  base:
    DEVELOPMENT_TEAM: 2Y4K7LQZ3R
    # Xcode extracts the localizable strings from the code into the String
    # Catalog — this guarantees the interpolation key format is exact.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  TreadPilot:
    type: application
    platform: iOS
    sources: [TreadPilot]
    info:
      path: TreadPilot/Info.plist
      properties:
        CFBundleDisplayName: TreadPilot
        CFBundleName: TreadPilot
        UILaunchScreen: {}
        # English is the source text; the Hungarian translation lives in
        # TreadPilot/Resources/InfoPlist.xcstrings
        NSBluetoothAlwaysUsageDescription: >-
          Bluetooth access is required to connect to your treadmill, read
          workout data, and control the belt.
        NSHealthShareUsageDescription: >-
          Your body data (weight, height, age, sex) is used to calculate
          calorie burn accurately.
        NSHealthUpdateUsageDescription: >-
          Saving workouts to the Health app keeps your runs and lets you share
          them with other apps such as Strava.
        UIBackgroundModes: [bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - SpaceGrotesk-Light.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
        UIUserInterfaceStyle: Dark
    entitlements:
      path: TreadPilot/TreadPilot.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: hu.backlog.treadpilot
    dependencies:
      - target: TreadPilotWatch

  TreadPilotWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [TreadPilotWatch]
    info:
      path: TreadPilotWatch/Info.plist
      properties:
        CFBundleDisplayName: TreadPilot
        CFBundleName: TreadPilot
        WKApplication: true
        WKCompanionAppBundleIdentifier: hu.backlog.treadpilot
        # Without this an HKWorkoutSession cannot run on watchOS (and
        # starting it from the phone does not work either).
        WKBackgroundModes:
          - workout-processing
        # English is the source text; the Hungarian translation lives in
        # TreadPilotWatch/InfoPlist.xcstrings
        NSHealthShareUsageDescription: >-
          Required to measure your heart rate live and mirror it to the
          iPhone app.
        NSHealthUpdateUsageDescription: >-
          Required to record the workout session on your Watch.
    entitlements:
      path: TreadPilotWatch/TreadPilotWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        # Swift 5 mode runs here because of the HealthKit delegate patterns —
        # enabling strict concurrency checking is a separate task.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: hu.backlog.treadpilot.watchkitapp
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TreadPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TreadPilotTests]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TreadPilot

schemes:
  TreadPilot:
    build:
      targets:
        TreadPilot: all
    test:
      targets: [TreadPilotTests]
  # Direct run onto the paired Watch — for diagnosing installation failures.
  TreadPilotWatch:
    build:
      targets:
        TreadPilotWatch: all
