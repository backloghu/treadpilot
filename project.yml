name: TreadPilot
options:
  bundleIdPrefix: hu.backlog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Projektszintű beállítás — minden target örökli, így se Xcode-ban, se
# CLI-buildnél nem kell külön megadni a fejlesztői csapatot.
settings:
  base:
    DEVELOPMENT_TEAM: 2Y4K7LQZ3R

targets:
  TreadPilot:
    type: application
    platform: iOS
    sources: [TreadPilot]
    info:
      path: TreadPilot/Info.plist
      properties:
        CFBundleDisplayName: TreadPilot
        CFBundleName: TreadPilot
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: >-
          A Bluetooth-hozzáférés a futópad csatlakoztatásához, az
          edzésadatok kiolvasásához és a pad vezérléséhez szükséges.
        NSHealthShareUsageDescription: >-
          A testadatok (súly, magasság, kor, nem) a pontos kalóriaszámításhoz
          szükségesek.
        NSHealthUpdateUsageDescription: >-
          Az edzések mentése az Egészség appba a futások megőrzéséhez és más
          appokkal (pl. Strava) való megosztásához szükséges.
        UIBackgroundModes: [bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - SpaceGrotesk-Light.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
        UIUserInterfaceStyle: Dark
    entitlements:
      path: TreadPilot/TreadPilot.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: hu.backlog.treadpilot
    dependencies:
      - target: TreadPilotWatch

  TreadPilotWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [TreadPilotWatch]
    info:
      path: TreadPilotWatch/Info.plist
      properties:
        CFBundleDisplayName: TreadPilot
        CFBundleName: TreadPilot
        WKApplication: true
        WKCompanionAppBundleIdentifier: hu.backlog.treadpilot
        # Enélkül watchOS-en nem futhat HKWorkoutSession (és a telefonról
        # indítás sem működik).
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: >-
          A pulzus élő méréséhez és az iPhone-appba tükrözéséhez szükséges.
        NSHealthUpdateUsageDescription: >-
          Az edzés Watch-oldali rögzítéséhez szükséges.
    entitlements:
      path: TreadPilotWatch/TreadPilotWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        # A HealthKit delegate-minták miatt itt Swift 5 mód fut — a szigorú
        # konkurencia-ellenőrzés bekapcsolása külön feladat.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: hu.backlog.treadpilot.watchkitapp
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TreadPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TreadPilotTests]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TreadPilot

schemes:
  TreadPilot:
    build:
      targets:
        TreadPilot: all
    test:
      targets: [TreadPilotTests]
  # Közvetlen futtatás a párosított órára — telepítési hibák diagnosztizálásához.
  TreadPilotWatch:
    build:
      targets:
        TreadPilotWatch: all
