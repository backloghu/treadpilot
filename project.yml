name: TunturiRun
options:
  bundleIdPrefix: dev.nitrolearning
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  TunturiRun:
    type: application
    platform: iOS
    sources: [TunturiRun]
    info:
      path: TunturiRun/Info.plist
      properties:
        CFBundleDisplayName: TreadPilot
        CFBundleName: TreadPilot
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: >-
          A Bluetooth-hozzáférés a Tunturi futópad csatlakoztatásához,
          az edzésadatok kiolvasásához és a pad vezérléséhez szükséges.
        NSHealthShareUsageDescription: >-
          A testadatok (súly, magasság, kor, nem) a pontos kalóriaszámításhoz
          szükségesek.
        NSHealthUpdateUsageDescription: >-
          Az edzések mentése az Egészség appba a futások megőrzéséhez és más
          appokkal (pl. Strava) való megosztásához szükséges.
        UIBackgroundModes: [bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - SpaceGrotesk-Light.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
        UIUserInterfaceStyle: Dark
    entitlements:
      path: TunturiRun/TunturiRun.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: dev.nitrolearning.treadpilot
    dependencies:
      - target: TunturiRunWatch

  TunturiRunWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [TunturiRunWatch]
    info:
      path: TunturiRunWatch/Info.plist
      properties:
        CFBundleDisplayName: TreadPilot
        CFBundleName: TreadPilot
        WKApplication: true
        WKCompanionAppBundleIdentifier: dev.nitrolearning.treadpilot
        # Enélkül watchOS-en nem futhat HKWorkoutSession (és a telefonról
        # indítás sem működik).
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: >-
          A pulzus élő méréséhez és az iPhone-appba tükrözéséhez szükséges.
        NSHealthUpdateUsageDescription: >-
          Az edzés Watch-oldali rögzítéséhez szükséges.
    entitlements:
      path: TunturiRunWatch/TunturiRunWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        # A HealthKit delegate-minták miatt itt Swift 5 mód fut — a szigorú
        # konkurencia-ellenőrzés bekapcsolása külön feladat.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: dev.nitrolearning.treadpilot.watchkitapp
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TunturiRunTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TunturiRunTests]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TunturiRun

schemes:
  TunturiRun:
    build:
      targets:
        TunturiRun: all
    test:
      targets: [TunturiRunTests]
  # Közvetlen futtatás a párosított órára — telepítési hibák diagnosztizálásához.
  TunturiRunWatch:
    build:
      targets:
        TunturiRunWatch: all
