name: TreadPilot
options:
  bundleIdPrefix: hu.backlog
  # Angol az alapnyelv (kulcs + fallback), a magyar fordításként a String
  # Catalogokban él (Localizable.xcstrings / InfoPlist.xcstrings).
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Projektszintű beállítás — minden target örökli, így se Xcode-ban, se
# CLI-buildnél nem kell külön megadni a fejlesztői csapatot.
settings:
  base:
    DEVELOPMENT_TEAM: 2Y4K7LQZ3R
    # A fordítandó szövegeket az Xcode szedi ki a kódból a String
    # Catalogba — így az interpolációs kulcsformátum garantáltan pontos.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  TreadPilot:
    type: application
    platform: iOS
    sources: [TreadPilot]
    info:
      path: TreadPilot/Info.plist
      properties:
        CFBundleDisplayName: TreadPilot
        CFBundleName: TreadPilot
        UILaunchScreen: {}
        # Az angol az alapszöveg, a magyar fordítás:
        # TreadPilot/Resources/InfoPlist.xcstrings
        NSBluetoothAlwaysUsageDescription: >-
          Bluetooth access is required to connect to your treadmill, read
          workout data, and control the belt.
        NSHealthShareUsageDescription: >-
          Your body data (weight, height, age, sex) is used to calculate
          calorie burn accurately.
        NSHealthUpdateUsageDescription: >-
          Saving workouts to the Health app keeps your runs and lets you share
          them with other apps such as Strava.
        UIBackgroundModes: [bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - SpaceGrotesk-Light.ttf
          - SpaceGrotesk-Regular.ttf
          - SpaceGrotesk-Medium.ttf
          - SpaceGrotesk-SemiBold.ttf
          - SpaceGrotesk-Bold.ttf
        UIUserInterfaceStyle: Dark
    entitlements:
      path: TreadPilot/TreadPilot.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: hu.backlog.treadpilot
    dependencies:
      - target: TreadPilotWatch

  TreadPilotWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [TreadPilotWatch]
    info:
      path: TreadPilotWatch/Info.plist
      properties:
        CFBundleDisplayName: TreadPilot
        CFBundleName: TreadPilot
        WKApplication: true
        WKCompanionAppBundleIdentifier: hu.backlog.treadpilot
        # Enélkül watchOS-en nem futhat HKWorkoutSession (és a telefonról
        # indítás sem működik).
        WKBackgroundModes:
          - workout-processing
        # Az angol az alapszöveg, a magyar fordítás:
        # TreadPilotWatch/InfoPlist.xcstrings
        NSHealthShareUsageDescription: >-
          Required to measure your heart rate live and mirror it to the
          iPhone app.
        NSHealthUpdateUsageDescription: >-
          Required to record the workout session on your Watch.
    entitlements:
      path: TreadPilotWatch/TreadPilotWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        # A HealthKit delegate-minták miatt itt Swift 5 mód fut — a szigorú
        # konkurencia-ellenőrzés bekapcsolása külön feladat.
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_BUNDLE_IDENTIFIER: hu.backlog.treadpilot.watchkitapp
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TreadPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TreadPilotTests]
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: TreadPilot

schemes:
  TreadPilot:
    build:
      targets:
        TreadPilot: all
    test:
      targets: [TreadPilotTests]
  # Közvetlen futtatás a párosított órára — telepítési hibák diagnosztizálásához.
  TreadPilotWatch:
    build:
      targets:
        TreadPilotWatch: all
