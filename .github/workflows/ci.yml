name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # The Xcode version on the runner images changes, so we do not pin it:
      # we pick the newest installed one. Xcode 16 is the minimum because of
      # the Swift 6 language mode.
      - name: Select the newest Xcode
        run: |
          set -euo pipefail
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj is generated and not version-controlled — without this
      # there is nothing to build.
      - name: Generate the Xcode project
        run: xcodegen generate

      # The installed simulators are image-dependent too, so we query them at
      # run time. simctl lists them in ascending runtime order, so the last
      # iPhone runs on the newest system.
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=$(xcrun simctl list devices available \
                 | grep -E '^[[:space:]]+iPhone' \
                 | tail -1 \
                 | sed -E 's/^[[:space:]]*(.+) \([0-9A-Fa-f-]+\) \(.*$/\1/')
          if [ -z "$NAME" ]; then
            echo "No iPhone simulator available on this runner:"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Run the unit tests
        run: |
          set -euo pipefail
          set -o pipefail
          xcodebuild test \
            -project TreadPilot.xcodeproj \
            -scheme TreadPilot \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM= \
            > xcodebuild.log 2>&1 \
            || { echo "::error::The build or the tests failed"; grep -E 'error:' xcodebuild.log | head -40; tail -60 xcodebuild.log; exit 1; }
          grep -E 'Executed [0-9]+ tests|\*\* TEST' xcodebuild.log | tail -4

      - name: Upload the build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 7
